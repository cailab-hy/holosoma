# =====================================================================
#  Must-Preserve Behaviours  (refactor invariants)
# =====================================================================
must_preserve_behaviors:
  router_invariants:
    - "algo_mode='auto' + critic_penalty_mode='vanilla_cql' must resolve to MODE_CQL."
    - "algo_mode='smqr_anchor' + critic_penalty_mode='smqr_cont_self' + sc_tau_res_scale=0.0 must validate and run."
    - "Explicit algo_mode contradicting the legacy keys must raise ValueError (per resolve_algo_mode)."
    - "Phase A guard: algo_mode='smqr_learned' must still be runnable only behind smqr_learned_phase_b_optin=True."
  numerical_invariants:
    - "tau(s) for anchor-only SMQR == q_data.detach().min(dim=0).values  (no residual when sc_tau_res_scale=0.0)."
    - "q_times_g logits  ==  Q_cat_raw * g − log_p_cat  (no detach on g, no log floor)."
    - "sg_weighted_lse logits  ==  Q_cat_raw + log(g.detach().clamp_min(smqr_sg_eps)) − log_p_cat."
    - "sg_blend per_state_penalty  ==  (1−λ)·P_qg + λ·P_sgw  where λ resolves from smqr_blend_schedule."
    - "Fixed-schedule λ_start=λ_end=0.5 is bit-equivalent to the prior 50/50 blend at all steps."
    - "cql_logsumexp computed in float32 with clamp(±q_clip); upcast must be preserved under AMP."
    - "cql_loss = cql_loss_scale · α_effective · penalty_for_loss   (Stage-R1 multiplicative scale)."
    - "α_effective dispatch: td_relative / fixed_effective / Lagrangian — three branches must remain bit-exact for each."
    - "cql_penalty (telemetry tensor) stays unfiltered even when cql_penalty_floor_optin=True; only the loss copy is clamped to ≥0."
  cross_contamination_guards:
    - "smqr_lse_mode ∈ {q_times_detached_g, sg_weighted_lse, sg_blend} must hard-fail unless algo_mode='smqr_anchor' AND smqr_anchor_objective='vanilla' AND sc_tau_res_scale=0.0 AND smqr_learned_phase_f_optin=False AND no F1/G1/H1/B2 flag is set."
    - "smqr_anchor_objective='stabilized' must hard-fail unless smqr_anchor_phase_e_optin=True."
    - "smqr_h1_alpha_floor and smqr_b2_alpha_floor must be mutually exclusive (only one >0)."
  logging_invariants:
    - "train metric dict must continue to expose: td_loss, critic_grad_norm, cql_penalty, q_data_mean, cql_q_rand_mean, q_overestimation_gap, actor_loss, bc_loss, action_std, policy_entropy, cql_alpha."
    - "eval_summary.json must continue to expose: success_rate, first_contact_rate, grasp_rate_v1, grasp_rate_v2, lift_rate_v1, lift_after_contact_rate, mean_min_hand_obj_dist, mean_reward, mean_length."
  io_invariants:
    - "Checkpoint format: torch state_dict at model_{step:07d}.pt + ONNX export at model_{step:07d}.onnx."
    - "Per-run holosoma_config.yaml snapshot must remain a faithful ExperimentConfig dump (used here as ground truth)."

# =====================================================================
#  Refactor Risk Register
# =====================================================================
refactor_risks:
  - id: R1
    area: algo_mode resolver
    description: "Splitting the three modes into separate Strategy/Policy classes risks dropping the explicit-vs-legacy validation in _validate_explicit_against_legacy()."
    mitigation: "Unit-test resolve_algo_mode() with the explicit (legacy_key, expected_mode) matrix from algo_mode.py docstring before/after refactor."

  - id: R2
    area: τ(s) computation
    description: "Anchor τ uses q_data.detach().min(dim=0) where dim=0 is the critic axis. A refactor that moves this into a shared helper can easily swap to dim=1 (batch axis) → silent τ collapse to a scalar."
    mitigation: "Pin a tensor-shape assert (τ.shape == (B,)) and a numerical equivalence test against the q_data fixture."

  - id: R3
    area: SMQR logit branches
    description: "Five logit forms (q_times_g, q_times_detached_g, sg_weighted_lse, sg_blend, stabilized) currently share local variables (_g, _log_p_cat, _q_clip). Splitting into methods risks ε-default drift, detach-position drift, or losing the per-branch clamp."
    mitigation: "Property-test each logit form against a fixed (Q, log_p, tau, beta) fixture and compare to bit-exact reference tensors."

  - id: R4
    area: sg_blend λ schedule
    description: "smqr_blend_schedule has 4 modes (fixed / linear / delayed_linear / piecewise). Moving the schedule into a Scheduler class risks off-by-one at warmup boundary or losing the fixed-mode shortcut."
    mitigation: "Test λ(t) values at t ∈ {0, warmup_steps−1, warmup_steps, warmup_steps+ramp_steps, +∞} per schedule type."

  - id: R5
    area: cql_loss scaling chain
    description: "cql_loss is multiplied by cql_loss_scale AFTER the α-dispatch but BEFORE addition to critic_loss. The V1 anchor-shrinkage term (_v1_shrink_loss) is added separately and is NOT scaled. A naive 'unified scale' refactor can mis-scale the shrinkage."
    mitigation: "Add an explicit test that toggling cql_loss_scale changes critic_loss by exactly cql_loss_scale · (old cql_loss) and leaves shrinkage untouched."

  - id: R6
    area: cross-contamination guards
    description: "Setup-time hard-fails (offline_cql_agent.py:307–392) ensure mutually-incompatible flags can't co-activate. A refactor that moves validation into pydantic/dataclass __post_init__ may lose the error-message context and the specific allowlist semantics."
    mitigation: "Keep guards as standalone validator that runs against the resolved ExperimentConfig; add negative tests for each illegal combination."

  - id: R7
    area: legacy key fallthrough
    description: "Code reads getattr(args, 'smqr_lse_mode', 'q_times_g') etc. with safe defaults in multiple places. Centralising config access must preserve the exact default for each key."
    mitigation: "Diff the getattr-defaults table from offline_cql_agent.py and assert each default survives in the refactored config layer."

  - id: R8
    area: AMP / dtype boundaries
    description: "cql_logsumexp upcasts to float32 and clamps via _q_clip explicitly; q_pred_all stays in autocast dtype. A refactor consolidating dtypes can introduce silent fp16/bf16 overflow."
    mitigation: "Run a smoke test under amp_dtype=bf16 with a high-|Q| fixture; assert no NaN/Inf in cql_logsumexp."

  - id: R9
    area: eval-side reproducibility
    description: "Eval numbers in this manifest are pinned to (seed=20240601, num_envs=256, max_steps=600, torch_deterministic=True). Refactoring the actor sampling code (actions_with_log_probs, get_actions_and_log_probs) can change the deterministic sequence."
    mitigation: "Pin an eval-byte-level regression: rerun eval_command for each algo against the golden checkpoint and require eval_summary.json scalars within ±1e-4 of recorded."

  - id: R10
    area: checkpoint compatibility
    description: "Refactor that renames qnet / actor submodule attributes (e.g. tau_head) breaks load of these golden checkpoints."
    mitigation: "Provide an explicit state_dict-key migration table and a load_checkpoint smoke test against each pinned checkpoint."

# =====================================================================
#  Caveats / Known Gaps
# =====================================================================
caveats:
  - "Numeric train-metric baselines (e.g. final td_loss, cql_penalty values) are NOT recorded here — only required keys are pinned. The TensorBoard event files under each run's tfevents_glob are the authoritative numeric source; a follow-up script should scrape them into a sidecar YAML."
  - "Training launch commands shown in train_script are RECONSTRUCTED from the saved holosoma_config.yaml. The original interactive CLI history is not preserved on disk."
  - "exp_82_perf_smqrsg_critlr05 uses critic_learning_rate=1.5e-4 (half of the shared 3e-4). This is intentional and is the only divergence from the shared envelope; it is retained as the canonical 'pure sg_weighted_lse, halved critic LR' regression point."
  - "Several flags (smqr_learned_phase_*_optin, sc_mask_*, sc_severity_*, sc_phase_*) are inert under all three current production tracks but are still serialised into holosoma_config.yaml. They MUST remain readable from config without raising, even after refactor."
