# =====================================================================
#  Offline-RL Golden Reference Manifest
# =====================================================================
#  Purpose
#  -------
#  Pin the current behaviour of the three production-track offline-RL
#  algorithms (CQL / SMQR anchor / SMQR-SG) so any future refactor of
#  ``src/holosoma/holosoma/agents/offline_cql/`` can be regression-tested
#  against a fixed set of (config, checkpoint, eval-metric) tuples.
#
#  Conventions
#  -----------
#  * ``checkpoint_path`` and ``config_path`` are RELATIVE to the repo root
#    ( /home/cai/holosoma ).  The config YAMLs are the FULL hydra-style
#    snapshots that ``train_agent`` writes alongside every run; they are
#    the authoritative record of the run's ExperimentConfig.
#  * ``train_command`` records the entry-point.  Concrete CLI overrides
#    used to launch these specific exp_* runs were typed in interactively
#    and are not preserved on disk — the saved ``holosoma_config.yaml``
#    is the ground truth.  Re-deriving CLI args from the YAML is
#    straightforward (every leaf key maps 1:1 to a ``--<dotted.key>``
#    tyro flag).
#  * ``eval_command`` shows the canonical eval invocation; concrete
#    paths used per algo are listed under each entry.
#  * Eval metrics in ``expected_eval_metrics`` are taken VERBATIM from
#    ``eval_summary.json`` for the listed checkpoint, evaluated with the
#    settings under ``eval_settings``.
#  * Train metrics in ``expected_train_metrics`` are listed as REQUIRED
#    KEYS, not numeric baselines.  Numeric baselines would require
#    parsing the TensorBoard event files; the manifest deliberately
#    pins the keys (so a refactor cannot silently drop a metric) and
#    delegates numeric regression to a follow-up TB-scrape script.
#  * All numbers were recorded on 2026-05-11.

manifest_version: 1
recorded_at: 2026-05-11
repo_root: /home/cai/holosoma
train_entrypoint: python -m holosoma.train_agent
eval_entrypoint:  python -m holosoma.eval_agent

# Shared eval settings used to produce every eval_summary.json below.
# Matches scripts/run_paired_eval.sh defaults.
eval_settings:
  num_envs: 256
  max_steps: 600
  seed: 20240601
  torch_deterministic: true
  grasp_radius: 0.12
  lift_height_margin: 0.05
  headless: true
  single_episode_per_env: true
  save_eval_results: true

# Shared dataset / task envelope (identical across all three algos;
# pinned here so a refactor can't silently swap dataset or task).
shared_envelope:
  dataset_path: offline_data/fastsac_dataset.h5
  task: g1_29dof whole-body tracking + box (sub3_largebox_003)
  env_class: holosoma.envs.wbt.wbt_manager.WholeBodyTrackingManager
  simulator: holosoma.simulator.isaacsim.isaacsim.IsaacSim
  algo_target: holosoma.agents.offline_rl.algorithms.cql.agent.CQLAgent
  robot_actions_dim: 29
  num_q_networks: 2
  gamma: 0.99
  target_tau: 0.005
  amp: true
  amp_dtype: bf16
  obs_normalization: true
  q_normalizer_mode: adaptive
  use_layer_norm: true
  use_tanh: true
  actor_hidden_dim: 256
  critic_hidden_dim: 256
  actor_learning_rate: 3.0e-4
  alpha_init: 0.2
  alpha_learning_rate: 3.0e-4
  alpha_min: 0.02
  use_autotune: true                 # SAC α autotune
  cql_num_random_actions: 40
  cql_num_policy_actions: 40
  q_clip: 10000.0
  policy_frequency: 2
  save_interval: 10000
  logging_interval: 100

# =====================================================================
#                          ALGORITHM ENTRIES
# =====================================================================
algorithms:

  # -------------------------------------------------------------------
  #  A. CQL baseline
  # -------------------------------------------------------------------
  - algorithm_name: cql
    role: baseline
    run_name: exp_80_perf_cql_seed1_bs4096_300k
    checkpoint_path: logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/model_0300000.pt
    config_path:     logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/holosoma_config.yaml
    eval_results_dir: eval_out/perf_stage1_cql/step_300000
    train_log:       logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/train.log
    tfevents_glob:   logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/events.out.tfevents.*
    train_script: |
      # Equivalent to:
      python -m holosoma.train_agent \
        --algo.config.algo_mode auto \
        --algo.config.critic_penalty_mode vanilla_cql \
        --algo.config.actor_update_mode sac_bc \
        --algo.config.batch_size 4096 \
        --algo.config.num_learning_iterations 300000 \
        --algo.config.bc_weight 2.5 \
        --algo.config.cql_alpha_mode td_relative \
        --algo.config.cql_td_ratio 0.5 \
        --algo.config.cql_alpha_floor 0.008 \
        --algo.config.dataset_path offline_data/fastsac_dataset.h5 \
        --training.seed 1
    eval_command: |
      python -m holosoma.eval_agent \
        --checkpoint logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/model_0300000.pt \
        --eval-results-dir eval_out/perf_stage1_cql/step_300000 \
        --algo-name perf_cql --checkpoint-step 300000 \
        --single-episode-per-env --save-eval-results \
        --eval-grasp-radius 0.12 --eval-lift-height-margin 0.05 \
        --eval-overrides.num-envs 256 --eval-overrides.headless True \
        --training.seed 20240601 --training.torch-deterministic True \
        --training.max-eval-steps 600
    key_hyperparameters:
      algo_mode: auto                              # resolves -> 'cql'
      critic_penalty_mode: vanilla_cql
      actor_update_mode: sac_bc
      batch_size: 4096
      bc_weight: 2.5
      num_learning_iterations: 300000
      critic_learning_rate: 3.0e-4
      cql_alpha_mode: td_relative
      cql_td_ratio: 0.5
      cql_alpha_floor: 0.008
      cql_alpha_init: 0.02
      cql_fixed_effective_alpha: 0.015            # unused under td_relative
      cql_effective_alpha_cap: 0.0                # disabled
      cql_penalty_floor_optin: false
      cql_loss_scale: 1.0                         # default (key absent => 1.0)
      # SMQR keys present but inert under critic_penalty_mode=vanilla_cql:
      sc_tau_res_scale: 2.0
      sc_tau_beta: 1.0
      smqr_lse_mode: q_times_g
      smqr_anchor_objective: vanilla
    expected_eval_metrics:
      checkpoint_step: 300000
      mean_reward: 11.3094
      mean_length: 119.31
      success_rate: 0.0
      first_contact_rate: 0.0
      grasp_rate_v1: 0.0
      grasp_rate_v2: 0.0
      lift_rate_v1: 0.34375
      lift_after_contact_rate: 0.0
      mean_min_hand_obj_dist: 0.4425
    expected_train_metrics_required_keys:
      - td_loss
      - critic_grad_norm
      - cql_penalty
      - q_data_mean
      - cql_q_rand_mean
      - q_overestimation_gap
      - actor_loss
      - bc_loss
      - action_std
      - policy_entropy
    notes:
      - "algo_mode='auto' resolves to MODE_CQL via algo_mode.resolve_algo_mode() because critic_penalty_mode='vanilla_cql'."
      - "Warm-started from exp_70_perf_cql_seed1_bs4096_100k/model_0100000.pt (see training.checkpoint in yaml); the 300k checkpoint is the canonical end-of-stage1 baseline."
      - "No grasp/success at 300k — this is the CQL floor against which SMQR variants are compared."

  # -------------------------------------------------------------------
  #  B. SMQR anchor (anchor-only, q_times_g)
  # -------------------------------------------------------------------
  - algorithm_name: smqr_anchor
    role: anchor_baseline
    run_name: exp_81_perf_smqr_qtimesg_seed1_bs4096_300k
