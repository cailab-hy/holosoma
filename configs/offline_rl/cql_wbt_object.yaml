# =====================================================================
# Example config: CQL on WBT-object dataset (Step 5 scaffold)
# =====================================================================
# This is an EXAMPLE / TEMPLATE config.  It is NOT consumed by
# train_agent.py automatically.  Use the documented CLI flags
# (see legacy_config_reference below) to launch training.
#
# Golden reference: exp_80_perf_cql_seed1_bs4096_300k
#   (see configs/golden/offline_rl_golden_manifest.yaml)
# =====================================================================

algorithm: cql
dataset: wbt_object

# Reference to the legacy production config that this example mirrors.
legacy_config_reference: |
  Preset:  exp:g1-29dof-wbt-offline-cql-w-object
  Launch:  bash scripts/train_replication/train_cql_seed2.sh
  Active code path:
    holosoma/agents/offline_cql/offline_cql_agent.py
    (critic_penalty_mode='vanilla_cql')
  Extracted helper (Step 4-A):
    holosoma/agents/offline_rl/algorithms/cql/losses.py

run_name_example: exp_NN_cql_<dataset>_seed<S>_bs<B>_<iters>k

# Example checkpoint / eval manifest binding.
checkpoint_example: logs/hv-g1-manager/exp_80_perf_cql_seed1_bs4096_300k/model_0300000.pt
eval_manifest_entry_example:
  experiment_name: cql_golden_300k
  checkpoint_steps: [300000]

# Hyper-parameters mirror the seed=1 golden reference.
hyperparameters:
  critic_penalty_mode: vanilla_cql
  cql_num_random_actions: 10
  cql_num_policy_actions: 10
  cql_alpha_init: 1.0
  cql_alpha_autotune: false
  cql_loss_scale: 1.0
  bc_weight: 1.0
  batch_size: 4096
  num_learning_iterations: 300000
  save_interval: 50000

notes: |
  * CQL conservative penalty helper extracted in Step 4-A; bit-exact
    against the inline reference (16 equivalence test cases).
  * cql_loss_scale=1.0 in this example; the Stage-R/S sweeps use
    0.25/0.5 to balance against bc_weight.
  * DO NOT use this YAML as a Pydantic config — it is documentation
    only.  Production launches go through train_agent.py CLI flags.
